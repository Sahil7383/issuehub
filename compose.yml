services:
  mongo:
    image: mongo:8
    container_name: issuehub-mongo
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./server

    container_name: issuehub-api

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/issuehub

    depends_on:
      - mongo

  frontend:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: /api

    container_name: issuehub-frontend

    ports:
      - "3000:80"

    depends_on:
      - api

volumes:
  mongo-data: